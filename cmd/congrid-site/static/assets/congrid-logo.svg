<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .line { stroke: #58a6ff; stroke-width: 5; stroke-linecap: round; }
        .node { fill: #c9d1d9; }
        .node-active { fill: #58a6ff; }
    </style>
    <line class="line" x1="25" y1="25" x2="50" y2="50" />
    <line class="line" x1="50" y1="50" x2="25" y2="75" />
    <line class="line" x1="50" y1="50" x2="75" y2="50" />
    <line class="line" x1="75" y1="50" x2="75" y2="25" />

    <circle class="node" cx="25" cy="25" r="8"/>
    <circle class="node" cx="50" cy="25" r="8"/>
    <circle class="node-active" cx="75" cy="25" r="8"/>
    <circle class="node" cx="25" cy="50" r="8"/>
    <circle class="node-active" cx="50" cy="50" r="8"/>
    <circle class="node-active" cx="75" cy="50" r="8"/>
    <circle class="node-active" cx="25" cy="75" r="8"/>
    <circle class="node" cx="50" cy="75" r="8"/>
    <circle class="node" cx="75" cy="75" r="8"/>
</svg>
