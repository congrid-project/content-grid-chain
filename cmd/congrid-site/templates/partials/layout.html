{{define "layout"}}
<!doctype html>
<html lang="{{if .ContentLanguage}}{{.ContentLanguage}}{{else}}{{language}}{{end}}">
  <head>
    {{template "head" .}}
  </head>
  <body>
    {{template "nav" .}}
    <main>
      {{block "main" .}}{{end}}
    </main>
    {{template "footer" .}}
  </body>
</html>
{{end}}
